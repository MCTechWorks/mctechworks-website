<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Message Sent | MC TechWorks</title>

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="thank-you.css">
</head>

<body>

<header>
    <div class="header-content">

        <a href="index.html"
           class="brand brand-home-link"
           aria-label="MC TechWorks home">

            <img src="images/Logo.png"
                 alt="MC TechWorks Logo"
                 class="logo">

            <div class="header-text">
                <h1>MC TECHWORKS</h1>
                <p>PC REPAIR. UPGRADES. BUILDS. CLEANING</p>
                <p>WEB DESIGN</p>
            </div>

        </a>

        <button type="button"
                class="menu-toggle"
                id="menu-toggle"
                aria-label="Open navigation menu"
                aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="main-nav">
            <a href="index.html">HOME</a>
            <a href="services.html">SERVICES</a>
            <a href="about.html">ABOUT</a>
            <a href="contact.html">CONTACT</a>
            <a href="webdesign.html">WEBSITE SERVICES</a>
        </nav>

    </div>
</header>

<main class="thank-you-page">

    <section class="thank-you-content">

        <div class="success-icon">
            <span aria-hidden="true">✓</span>
        </div>

        <h2>MESSAGE SENT!</h2>

        <p>
            Thank you for contacting MC TechWorks!
            Your message has been successfully submitted.
        </p>

        <p>
            I'll review your inquiry and get back to you
            as soon as possible.
        </p>

        <a href="index.html" class="thank-you-btn">
            BACK TO HOME
        </a>

    </section>

</main>

</body>
<script>
    const menuToggle = document.getElementById("menu-toggle");
    const mainNav = document.getElementById("main-nav");

    function toggleMenu() {
        const isOpen = mainNav.classList.toggle("open");
        menuToggle.classList.toggle("open", isOpen);
        menuToggle.setAttribute("aria-expanded", isOpen);
        menuToggle.setAttribute(
            "aria-label",
            isOpen ? "Close navigation menu" : "Open navigation menu"
        );
    }

    menuToggle.addEventListener("click", function (e) {
        e.preventDefault();
        toggleMenu();
    });
</script>
</html>
